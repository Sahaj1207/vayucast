# Every morning: make forecasts, score yesterday's forecasts, check for drift.
# Results are committed back to the repo, so the dashboard always shows fresh numbers.
name: daily forecast and monitoring

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC = 07:00 in India
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

permissions:
  contents: write             # allowed to commit the results

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.monitor
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions reports/monitoring.json
          git diff --cached --quiet || git commit -m "Daily forecast and monitoring $(date -u +%Y-%m-%d)"
          git push
