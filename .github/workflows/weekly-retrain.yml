# Every Sunday: download the latest data, retrain, test, and commit the new model.
name: weekly retrain

on:
  schedule:
    - cron: "0 2 * * 0"      # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m src.fetch_data
      - run: python -m src.train
      - run: pytest -q          # don't publish a model if the tests break
      - name: Commit new model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed models reports
          git diff --cached --quiet || git commit -m "Weekly retrain $(date -u +%Y-%m-%d)"
          git push
